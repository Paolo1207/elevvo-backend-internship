# NGINX = the load balancer in front of the API replicas.
# It listens on port 80 inside its container (published as 8080 on your computer) and forwards every
# request to one of the "api" containers, taking turns (round-robin).
events {}

http {
  # Docker's built-in DNS. "api" resolves to the IP of EVERY running api replica.
  # Using a resolver + a variable makes NGINX re-check every 5 seconds, so after
  #   docker compose up -d --scale api=4
  # the new replicas receive traffic automatically, with no NGINX restart.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 80;

    location / {
      set $api_backend http://api:3000;
      proxy_pass $api_backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # If a replica is down or does not answer, try another one.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
    }
  }
}