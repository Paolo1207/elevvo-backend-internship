# Render Blueprint: two web services built from the SAME Dockerfile, one per environment.
# Copy this file to the ROOT of the repository (Render looks for render.yaml there), then: Render dashboard -> New -> Blueprint.
# Values marked `sync: false` are asked for in the dashboard, so no secret is ever written in this file or committed.
#
# Auto-deploy is OFF on purpose: only the GitHub Actions pipeline deploys (after tests, migrations and approval).
services:
  - type: web
    name: shop-api-staging
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./industry-level/task-10-production-system/Dockerfile
    dockerContext: ./industry-level/task-10-production-system
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon staging branch connection string
        sync: false
      - key: REDIS_URL # Upstash staging database, starts with rediss://
        sync: false
      - key: JWT_SECRET # generated by Render, different for every service
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS # comma separated browser origins, for example https://my-frontend.example
        value: http://localhost:5173
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: DB_POOL_MAX
        value: "5"

  - type: web
    name: shop-api-production
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./industry-level/task-10-production-system/Dockerfile
    dockerContext: ./industry-level/task-10-production-system
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon production branch connection string
        sync: false
      - key: REDIS_URL # a different Upstash database, starts with rediss://
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: DB_POOL_MAX
        value: "5"
